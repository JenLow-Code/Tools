name: JenLow Soundcheck VST3

on:
  push:
    branches: [main]
    paths:
      - 'plugins/soundcheck/**'
      - '.github/workflows/soundcheck-vst3.yml'
  pull_request:
    paths:
      - 'plugins/soundcheck/**'
      - '.github/workflows/soundcheck-vst3.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE plug-in
        run: cmake -S plugins/soundcheck -B build/soundcheck -G "Visual Studio 17 2022" -A x64
      - name: Build VST3 and Standalone
        run: cmake --build build/soundcheck --config Release --parallel 4
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: jenlow-soundcheck-windows
          path: |
            build/soundcheck/JenLowSoundcheck_artefacts/Release/VST3/**
            build/soundcheck/JenLowSoundcheck_artefacts/Release/Standalone/**
          if-no-files-found: error
